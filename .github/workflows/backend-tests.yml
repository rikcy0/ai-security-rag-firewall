name: Backend tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RAG_FIREWALL_APP_ENV: test
  RAG_FIREWALL_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/rag_firewall
  RAG_FIREWALL_SECRET_KEY: ci-only-secret-key-for-automated-tests

jobs:
  non-integration-tests:
    name: Non-integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run non-integration tests
        run: python -m pytest backend/tests -m "not integration" -v

  integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_firewall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_firewall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check model and migration consistency
        run: python -m alembic check

      - name: Run PostgreSQL integration tests
        run: python -m pytest backend/tests -m integration -v